<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firing Squad Simulation - OS Visualizer</title>
  <meta name="description" content="Firing Squad Synchronization visualization">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  
  <style>
    .sim-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
      gap: 30px;
    }

    .simulation-panel {
      background-color: var(--card-bg, #0f172a);
      border: 1px solid var(--border-color, rgba(255,255,255,0.1));
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      width: 100%;
      max-width: 1000px;
      box-shadow: var(--shadow);
    }
    
    .settings-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.03);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .form-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group label {
      font-weight: 500;
      color: #cbd5e1;
    }

    .form-group input {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.3s;
      width: 80px;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-group input[type="range"] {
      width: 150px;
      padding: 0;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #apply-btn {
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    #apply-btn:hover {
      background-color: rgba(56, 189, 248, 0.2);
      transform: translateY(-2px);
    }

    #start-btn {
      background-color: rgba(16, 185, 129, 0.1);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    #start-btn:hover {
      background-color: rgba(16, 185, 129, 0.2);
      transform: translateY(-2px);
    }

    #step-btn {
      background-color: rgba(245, 158, 11, 0.1);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    #step-btn:hover {
      background-color: rgba(245, 158, 11, 0.2);
      transform: translateY(-2px);
    }

    #reset-btn {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    #reset-btn:hover {
      background-color: rgba(239, 68, 68, 0.2);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .status-display {
      font-size: 1.2rem;
      margin-bottom: 25px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      color: var(--accent);
      min-height: 28px;
    }

    .step-display {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .process-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 30px 0;
      padding: 20px;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      min-height: 80px;
    }

    .process {
      width: 45px;
      height: 45px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      position: relative;
      background-color: #334155;
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border: 2px solid transparent;
    }

    .process.leader {
      background-color: #ef4444; /* General */
    }

    .process.active {
      background-color: #3b82f6; /* Active signal */
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }

    .process.fired {
      background-color: #f59e0b; /* Fired state */
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.8);
      transform: scale(1.1);
    }
    
    .process.quiescent {
      background-color: #475569;
    }

    .process-id {
      font-size: 0.8rem;
    }

    .process-state {
      position: absolute;
      top: -20px;
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: normal;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .color-leader { background-color: #ef4444; }
    .color-quiescent { background-color: #475569; }
    .color-active { background-color: #3b82f6; }
    .color-fired { background-color: #f59e0b; }

  </style>
</head>
<body>
  <div class="container">
    <header class="navbar">
      <div class="logo">OS Explorer</div>
      <nav>
          <a href="../../index.html">Home</a>
          <a href="../index.html">Back to Modules</a>
      </nav>
    </header>

    <div class="hero" style="padding: 30px; text-align: center; margin-bottom: 20px;">
      <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Firing Squad Synchronization</h1>
      <p style="color: var(--muted); max-width: 600px; margin: 0 auto;">Simulate a finite-state machine synchronization problem where all nodes must reach the "fired" state exactly at the same time.</p>
    </div>

    <div class="sim-container">
      <section class="simulation-panel">
        
        <div class="settings-panel">
          <div class="form-group">
            <label for="num-processes">Number of Nodes:</label>
            <input type="number" id="num-processes" min="3" max="30" value="10">
          </div>
          <div class="form-group">
            <label for="sim-speed">Speed:</label>
            <input type="range" id="sim-speed" min="100" max="1000" value="500">
          </div>
          <button id="apply-btn">Apply Settings</button>
        </div>

        <div class="status-display" id="status-msg">Ready to start synchronization</div>
        <div class="step-display" id="step-count">Time Step: 0</div>
        
        <div class="btn-group">
          <button id="start-btn">Start Auto</button>
          <button id="step-btn">Step Forward</button>
          <button id="reset-btn">Reset</button>
        </div>

        <div class="process-container" id="nodes-container">
          <!-- Nodes will be injected here -->
        </div>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-color color-leader"></div> Leader (General)
          </div>
          <div class="legend-item">
            <div class="legend-color color-quiescent"></div> Quiescent
          </div>
          <div class="legend-item">
            <div class="legend-color color-active"></div> Active/State Change
          </div>
          <div class="legend-item">
            <div class="legend-color color-fired"></div> Fired
          </div>
        </div>
        
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
