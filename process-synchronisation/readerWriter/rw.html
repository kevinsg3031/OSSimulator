<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reader-Writer Problem - OS Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    .sim-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .simulation-panel {
      background-color: var(--card-bg, #0f172a);
      border: 1px solid var(--border-color, rgba(255,255,255,0.1));
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      width: 100%;
      max-width: 800px;
      box-shadow: var(--shadow);
    }
    
    #reader-count {
      font-size: 24px;
      margin-bottom: 25px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: var(--accent);
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    #read-btn {
      background-color: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    #read-btn:hover {
      background-color: rgba(56, 189, 248, 0.2);
      transform: translateY(-2px);
    }

    #write-btn {
      background-color: rgba(244, 114, 182, 0.1);
      color: #f472b6;
      border: 1px solid rgba(244, 114, 182, 0.2);
    }
    #write-btn:hover {
      background-color: rgba(244, 114, 182, 0.2);
      transform: translateY(-2px);
    }

    #reset-btn {
      background-color: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    #reset-btn:hover {
      background-color: rgba(239, 68, 68, 0.2);
      transform: translateY(-2px);
    }

    #output {
      margin-top: 30px;
      background-color: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      max-width: 100%;
      text-align: left;
      font-size: 15px;
      font-family: monospace;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #e2e8f0;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    }

    #mutex-status {
      font-size: 18px;
      margin-top: 20px;
      font-weight: 600;
      color: #10b981; /* Default unlocked */
      padding: 10px 20px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .warning {
      color: #ef4444;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="navbar">
      <div class="logo">OS Explorer</div>
      <nav>
          <a href="../../index.html">Home</a>
          <a href="../index.html">Back to Modules</a>
      </nav>
    </header>

    <div class="hero" style="padding: 30px; text-align: center; margin-bottom: 20px;">
      <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Reader-Writer Problem</h1>
      <p style="color: var(--muted); max-width: 600px; margin: 0 auto;">Coordinate multiple readers and writers accessing a shared resource while preventing race conditions.</p>
    </div>

    <div class="sim-container">
      <section class="simulation-panel">
        <div id="reader-count">Readers: 0</div>
        
        <div class="btn-group">
          <button id="read-btn" onclick="startReading()">Start Reading</button>
          <button id="write-btn" onclick="startWriting()">Start Writing</button>
          <button id="reset-btn" onclick="reset()">Reset Simulation</button>
        </div>

        <div id="mutex-status">Mutex: Unlocked</div>

        <div id="output"></div>
      </section>
    </div>
  </div>

  <script>
    let readers = 0;
    let writers = 0;
    let writing = false;
    let timeouts = [];

    function startReading() {
      if (writers > 0 || writing) {
        showWarning("Cannot read. Writer is active.");
      } else {
        readers++;
        updateReaderCount();
        const statusElement = document.getElementById("mutex-status");
        statusElement.innerHTML = "Mutex: Locked (Reading)";
        statusElement.style.color = "#f59e0b"; // warning color
        read();
      }
    }

    function startWriting() {
      if (readers > 0) {
        showWarning(`Cannot write. ${readers} reader(s) are currently active.`);
      } else if (writing || writers > 0) {
        showWarning("Cannot write. Another writer is currently active.");
      } else {
        writers++;
        const statusElement = document.getElementById("mutex-status");
        statusElement.innerHTML = "Mutex: Locked (Writing)";
        statusElement.style.color = "#ef4444"; // error red
        write();
      }
    }

    function read() {
      if (writing || writers > 0) {
        const retryTimeout = setTimeout(read, 1000);
        timeouts.push(retryTimeout);
      } else {
        const output = document.getElementById("output");
        output.innerHTML += "<span style='color: #38bdf8'>Reader is reading...</span>\n";
        scrollToBottom(output);
        const timeout = setTimeout(function () {
          output.innerHTML += "<span style='color: #94a3b8'>Reader finished reading.</span>\n";
          scrollToBottom(output);
          readers--;
          updateReaderCount();
          updateReadersMutex();
        }, 2000);
        timeouts.push(timeout);
      }
    }

    function write() {
      if (writing || readers > 0 || writers > 1) {
        const retryTimeout = setTimeout(write, 1000);
        timeouts.push(retryTimeout);
      } else {
        writing = true;
        const output = document.getElementById("output");
        output.innerHTML += "<span style='color: #f472b6'>Writer is writing...</span>\n";
        scrollToBottom(output);
        const timeout = setTimeout(function () {
          output.innerHTML += "<span style='color: #94a3b8'>Writer finished writing.</span>\n";
          scrollToBottom(output);
          writing = false;
          writers--;
          updateWritersMutex();
        }, 3000);
        timeouts.push(timeout);
      }
    }
    
    function scrollToBottom(element) {
        element.scrollTop = element.scrollHeight;
    }

    function updateReaderCount() {
      document.getElementById("reader-count").innerHTML = `Readers: ${readers}`;
    }

    function updateWritersMutex() {
      if(writers == 0) {
        const statusElement = document.getElementById("mutex-status");
        statusElement.innerHTML = "Mutex: Unlocked";
        statusElement.style.color = "#10b981"; // success green
      }
    }

    function updateReadersMutex() {
      if(readers == 0) {
        const statusElement = document.getElementById("mutex-status");
        statusElement.innerHTML = "Mutex: Unlocked";
        statusElement.style.color = "#10b981";
      }
    }

    function showWarning(message) {
      const output = document.getElementById("output");
      output.innerHTML += `<span class="warning">${message}</span>\n`;
      scrollToBottom(output);
    }

    function reset() {
      // Cancel all pending timeouts
      timeouts.forEach(clearTimeout);
      timeouts = [];

      // Clear state and UI
      readers = 0;
      writers = 0;
      writing = false;
      document.getElementById("output").innerHTML = "";
      updateReaderCount();

      const statusElement = document.getElementById("mutex-status");
      statusElement.innerHTML = "Mutex: Unlocked";
      statusElement.style.color = "#10b981";
    }
  </script>
</body>
</html>
