<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeping Barber Simulation - OS Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      .simulation-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
        margin-top: 30px;
      }
      
      @media (min-width: 768px) {
        .simulation-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      
      @media (min-width: 1024px) {
        .simulation-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .sim-panel {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }

      .sim-panel h2 {
        font-size: 1.15rem;
        margin-bottom: 20px;
        text-align: center;
        color: var(--accent);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        margin-bottom: 20px;
      }

      .form-group label {
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .form-group input {
        background: #0f172a;
        border: 1px solid var(--border-color);
        color: var(--text);
        padding: 12px;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.3s;
      }

      .form-group input:focus {
        border-color: var(--accent);
      }

      .btn-start {
        background-color: var(--accent);
        color: white;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .btn-start:hover {
        background-color: var(--accent-hover);
        transform: translateY(-2px);
      }

      .error-text {
        color: #ef4444;
        font-size: 0.85rem;
        margin-top: 5px;
      }

      .room-content {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .hidden {
        display: none !important;
      }
      
      /* Status Messages Generated by script.js */
      .status-msg {
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.95rem;
        font-family: 'Inter', sans-serif;
        line-height: 1.4;
      }

      .status-msg.error {
        background-color: rgba(239, 68, 68, 0.1);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
      
      .status-msg.info {
        background-color: rgba(56, 189, 248, 0.1);
        color: #7dd3fc;
        border: 1px solid rgba(56, 189, 248, 0.2);
      }

      .status-msg.info-bold {
        background-color: rgba(56, 189, 248, 0.2);
        color: #38bdf8;
        font-weight: 600;
        border: 1px solid rgba(56, 189, 248, 0.4);
      }
      
      .status-msg.success {
        background-color: rgba(16, 185, 129, 0.1);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.2);
      }

      .status-msg.success-bold {
        background-color: rgba(16, 185, 129, 0.2);
        color: #10b981;
        font-weight: 600;
        border: 1px solid rgba(16, 185, 129, 0.4);
      }
      
      .status-msg.warning {
        background-color: rgba(245, 158, 11, 0.1);
        color: #fcd34d;
        border: 1px solid rgba(245, 158, 11, 0.2);
      }

      .status-msg.default {
        background-color: rgba(255, 255, 255, 0.05);
        color: #cbd5e1;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>

  <body>
    <div class="container">
        <header class="navbar">
            <div class="logo">OS Explorer</div>
            <nav>
                <a href="../../index.html">Home</a>
                <a href="../index.html">Back to Modules</a>
            </nav>
        </header>

        <section class="panel" style="margin-top: 40px; padding: 40px;">
            <h1 style="text-align: center; margin-bottom: 30px;">Sleeping Barber Simulation</h1>
            
            <div class="sim-panel" style="max-width: 600px; margin: 0 auto; margin-bottom: 40px;">
                <div class="form-group">
                    <label for="customerCount">Customer Count (or names separated by Space)</label>
                    <input id="customerCount" type="text" placeholder="e.g. 5, or 'John Alice Bob'" />
                </div>
                <div class="form-group">
                    <label for="chairCount">Waiting Chair Count</label>
                    <input id="chairCount" type="number" placeholder="e.g. 3" min="1"/>
                    <p id="chEr" class="error-text hidden">Chair must be greater than 0</p>
                </div>
                <button id="startButton" class="btn-start" onclick="start()">Start Simulation</button>
            </div>

            <div class="simulation-grid">
                <div class="sim-panel">
                    <h2>Customer Waiting Room</h2>
                    <div id="waitingRoom" class="room-content"></div>
                </div>
                <div class="sim-panel">
                    <h2>Haircut Room</h2>
                    <div id="cuttingRoom" class="room-content"></div>
                </div>
                <div id="baberSl" class="sim-panel hidden">
                    <h2>Barber Status</h2>
                    <div id="barberSleeping"></div>
                </div>
                <div class="sim-panel">
                    <h2>Customer Left Shop (Full Waiting)</h2>
                    <div id="leaveWaitingRoom" class="room-content"></div>
                </div>
                <div id="cuttingLeaving" class="sim-panel hidden">
                    <h2>Customer Successful Cuts</h2>
                    <div id="cuttingLeavingRoom" class="room-content"></div>
                </div>
            </div>
        </section>
    </div>
    
    <script src="script.js"></script>
  </body>
</html>
